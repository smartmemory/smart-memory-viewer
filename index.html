<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e293b" />
    <link rel="icon" type="image/svg+xml" href="/viewer-logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>SmartMemory Graph Viewer</title>
    <!-- Discord Activity embed: the host's ?theme=light|dark wins over the OS, applied before first paint and never stored.
         Runs after the kit's colour-mode script (prepended by smThemeHead) and only on an embed launch. -->
    <script>(function(){try{var q=new URLSearchParams(location.search),m=q.get('theme');if((m==='light'||m==='dark')&&q.has('guild_id')&&q.has('channel_id')){var r=document.documentElement;r.classList.remove('light','dark');r.classList.add(m);r.style.colorScheme=m}}catch(e){}})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
